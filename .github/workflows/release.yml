name: Release

# Builds the app, runs the unit tests, and publishes the APK as a GitHub Release.
# Run it by hand from the Actions tab, or push a tag like v0.1.0.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create, like v1.0.1 (leave empty for a test build)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: [app/build.gradle.kts]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # The signing key, so each new APK installs over the old one without losing data.
      # Secrets: PURPOSE_KEYSTORE_BASE64, PURPOSE_KEYSTORE_PASSWORD, PURPOSE_KEY_ALIAS, PURPOSE_KEY_PASSWORD.
      # A version tag must be signed with it: without the secrets, a tag build stops here instead of quietly
      # making a debug-signed APK that can't update the installed app. A hand-run build may go without.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PURPOSE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PURPOSE_KEYSTORE_PASSWORD }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          KEY_ALIAS: ${{ secrets.PURPOSE_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ] || [ -n "$RELEASE_TAG" ] || { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ]; }; then
              echo "::error::The signing secrets aren't set. Add the 4 PURPOSE_* secrets (see README), then run this again."
              exit 1
            fi
            echo "::warning::No signing key: this APK uses a throwaway debug key and can't update an installed Purpose."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          # Fails here, with a clear message, if the file, password or alias is wrong.
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::The keystore, its password or the alias doesn't match. Check the 4 PURPOSE_* secrets."; exit 1; }
          echo "PURPOSE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          PURPOSE_KEYSTORE_PASSWORD: ${{ secrets.PURPOSE_KEYSTORE_PASSWORD }}
          PURPOSE_KEY_ALIAS: ${{ secrets.PURPOSE_KEY_ALIAS }}
          PURPOSE_KEY_PASSWORD: ${{ secrets.PURPOSE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Show who signed it
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          # minSdk 26 means APK Signature Scheme v2+ only, so ask apksigner (in the runner's Android SDK).
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          SIGNER=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate DN" || true)
          echo "Signed by: $SIGNER"
          if [ -n "$PURPOSE_KEYSTORE_PATH" ] && echo "$SIGNER" | grep -q "Android Debug"; then
            echo "::error::The APK was signed with the debug key, not the release key."
            exit 1
          fi

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="purpose-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: purpose-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          # A pushed tag, or a tag typed when running it by hand (created here, on this commit).
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"
          elif [ -n "$RELEASE_TAG" ]; then TAG="$RELEASE_TAG"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ]; then TAG="v${{ steps.apk.outputs.version }}"
          else TAG="build-${GITHUB_RUN_NUMBER}"; fi
          # A release for this version may already exist (a dependency edit on main, or a tag pushed after the
          # version-bump merge already made it): add this build to it instead of failing the run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.name }}" --clobber
            exit 0
          fi
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "Purpose ${{ steps.apk.outputs.version }} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from ${GITHUB_SHA::7}. Download the .apk below and open it on your phone to install."
