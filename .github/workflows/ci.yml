name: CI

# Compiles the app and runs the unit tests on every push to a work branch.
# Prints the Room schema files at the end so migrations can be checked against them.
on:
  push:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Separate runs: debug and release KSP tasks both write the Room schema file and race if run together.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Room schemas
        if: success()
        run: find app/schemas -name '*.json' -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; || true


      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/

      - name: Upload smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: smoke-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  smoke:
    # Slow emulator run: only on main or when started by hand from the Actions tab.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-apk
          path: apks/new
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Fresh install and update smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/smoke.sh && cp -r apks/new apks/old && bash .github/smoke.sh
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-api-${{ matrix.api }}
          path: logcat-*.txt
